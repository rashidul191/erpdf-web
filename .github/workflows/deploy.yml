name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vxc_cpnael

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0

        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: 21098

          script: |
            set -e
            set -x

            echo "🚀 DEPLOY START"
            date
            whoami
            pwd

            # ── PHP & Composer ─────────────────────────────
            PHP_BIN=/opt/cpanel/ea-php82/root/usr/bin/php
            COMPOSER_BIN=/usr/local/bin/composer

            # ── PROJECT PATH (YOUR REAL SERVER PATH) ───────
            PROJECT_PATH=/home/vxcfoodandbevera/amanatwhitepalace.com
            GITHUB_PATH=SAWEBSOFTDEVS/amanat-white-palace-laravel-web.git

            echo "📁 PROJECT: $PROJECT_PATH"

            cd $PROJECT_PATH || {
              echo "❌ Project folder not found!"
              exit 1
            }

            # ── Git safety ──────────────────────────────────
            git config --global --add safe.directory $PROJECT_PATH

            # ── Init repo if not exists ─────────────────────
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${{ secrets.GH_TOKEN }}@github.com/$GITHUB_PATH
            fi

            # ── Sync latest code ────────────────────────────
            git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/$GITHUB_PATH
            git fetch origin main
            git reset --hard origin/main

            # ── Protect env file ignore ────────────────────────────
            git update-index --assume-unchanged .env 2>/dev/null || true
            git update-index --assume-unchanged public 2>/dev/null || true
            git update-index --assume-unchanged public/storage 2>/dev/null || true
            git update-index --assume-unchanged storage 2>/dev/null || true

            # ── Install dependencies ────────────────────────
            $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

            # ── Laravel Commands ────────────────────────────

            $PHP_BIN artisan migrate --force

            $PHP_BIN artisan db:seed --force || true

            $PHP_BIN artisan config:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan cache:clear

            $PHP_BIN artisan view:clear
            $PHP_BIN artisan view:cache

            $PHP_BIN artisan route:clear
            $PHP_BIN artisan route:cache

            $PHP_BIN artisan storage:link || true

            echo "✅ DEPLOY SUCCESSFUL"
