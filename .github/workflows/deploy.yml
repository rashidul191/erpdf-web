name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vxc_cpnael
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: 21098
          script: |
            # ── Safety ────────────────────────────────────────────
            git config --global --add safe.directory /home/vxcfoodandbevera/amanatwhitepalace.com
            cd /home/vxcfoodandbevera/amanatwhitepalace.com

            # ── Init repo if not already a git repo ───────────────
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${{ secrets.GH_TOKEN }}@github.com/SAWEBSOFTDEVS/amanat-white-palace-laravel-web.git
              git fetch origin main
              git checkout -b main --track origin/main
            fi

            # ── Update remote URL with token (in case it changed) ─
            git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/SAWEBSOFTDEVS/amanat-white-palace-laravel-web.git

            # ── Protect important files/folders ───────────────────
            git update-index --assume-unchanged .env
            git update-index --assume-unchanged public
            git update-index --assume-unchanged storage

            # ── Pull latest code ──────────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── Install dependencies ──────────────────────────────
            /usr/local/bin/php82 /usr/local/bin/composer install --no-dev --optimize-autoloader

            # ── Laravel commands ──────────────────────────────────
            /usr/local/bin/php82 artisan migrate --force
            /usr/local/bin/php82 artisan config:cache
            /usr/local/bin/php82 artisan view:cache
            /usr/local/bin/php82 artisan route:cache
            /usr/local/bin/php82 artisan storage:link