name: Deploy to cPanel
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vxc_cpnael
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: 21098
          script: |
            PHP_BIN=/opt/cpanel/ea-php82/root/usr/bin/php
            COMPOSER_BIN=/usr/local/bin/composer

            # ── Safety ────────────────────────────────────────────
            git config --global --add safe.directory /root/amanatwhitepalace.com
            cd /root/amanatwhitepalace.com

            # ── Init repo if not already a git repo ───────────────
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://${{ secrets.GH_TOKEN }}@github.com/SAWEBSOFTDEVS/amanat-white-palace-laravel-web.git
              git fetch origin main
              git reset --hard origin/main
            fi

            # ── Update remote URL with token ──────────────────────
            git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/SAWEBSOFTDEVS/amanat-white-palace-laravel-web.git

            # ── Pull latest code ──────────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # # ── Protect .env storage public after reset ───────────
            # git update-index --assume-unchanged .env 2>/dev/null || true
            # git update-index --assume-unchanged public 2>/dev/null || true
            # git update-index --assume-unchanged storage 2>/dev/null || true

            # ── Install dependencies ──────────────────────────────
            $PHP_BIN $COMPOSER_BIN install --no-dev --optimize-autoloader

            # ── Laravel commands ──────────────────────────────────
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan db:seed --force
            $PHP_BIN artisan migrate:fresh --seed --force
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan storage:link
